version: '3.9'

services:
  backend:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: visionops-backend
    working_dir: /app/backend
    command: bash -lc "PYTHONPATH=/app/backend python -m uvicorn app.main:app --host 0.0.0.0 --port 8000 --reload"
    ports:
      - "8000:8000"
    environment:
      - PYTHONPATH=/app/backend
      - CAMERA_INDEX=0
      - DATABASE_URL=sqlite:////app/backend/visionops.db
    volumes:
      - .:/app
    restart: unless-stopped

  frontend:
    image: node:20-alpine
    container_name: visionops-frontend
    working_dir: /app/frontend
    command: sh -lc "npm install && npm run dev -- --host 0.0.0.0 --port 3000"
    ports:
      - "3000:3000"
    volumes:
      - .:/app
    restart: unless-stopped
